appId: io.github.florian-stronck.topset
productName: Topset
copyright: Copyright © 2026 Florian Stronck. Licensed under AGPL-3.0-or-later.

# Left unpacked on purpose: better-sqlite3 ships a native .node that cannot be loaded
# out of an asar, and the Next server reads its own build output from disk.
asar: false

# better-sqlite3 ships Node-API prebuilds, which are stable across Node and Electron
# alike. Rebuilding them would only trade a working binary for a C++ toolchain.
npmRebuild: false

# Chromium's own UI strings, one .pak per language — 55 of them, ~50 MB the portable exe
# unpacks on every launch. Only the app's languages are kept (Luxembourgish falls back).
electronLanguages:
  - en-US
  - de
  - fr

directories:
  output: dist-desktop
  buildResources: build

# Only the main process and the one native module it loads itself. Everything the site
# needs is already traced into the standalone server, copied in below.
files:
  - "!**/*"
  - electron/**
  - package.json
  - node_modules/better-sqlite3/lib/**
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
  - node_modules/better-sqlite3/package.json
  # electron-updater and everything it requires, listed because the globs above start from
  # nothing. After upgrading it, check the list: `npm ls electron-updater --all`.
  - node_modules/electron-updater/**
  - node_modules/builder-util-runtime/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/jsonfile/**
  - node_modules/universalify/**
  - node_modules/js-yaml/**
  - node_modules/argparse/**
  - node_modules/lazy-val/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/lodash.isequal/**
  - node_modules/semver/**
  - node_modules/tiny-typed-emitter/**
  - node_modules/debug/**
  - node_modules/ms/**
  - node_modules/sax/**

# The built site is copied in by hand afterwards — see electron/after-pack.js for why
# neither the file globs nor extraResources can carry it.
afterPack: electron/after-pack.js

win:
  # An installer rather than the old zip folder: only an installed copy can update itself.
  # Per user, so installing and updating never ask for admin. The data is not in the install
  # folder but in %APPDATA%\Topset (see databaseFile in electron/main.js), which updates and
  # uninstalls leave alone.
  target:
    - nsis
  artifactName: Topset-Setup-${version}.${ext}
  icon: electron/icon.ico

# A short wizard (welcome, install, finish) rather than one click, for its branded pages
# and the finish page's tutorial choice — see electron/installer.nsh. Updates still
# install silently. Per user, so installing and updating never ask for admin.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  include: electron/installer.nsh
  installerSidebar: electron/installer-sidebar.bmp
  uninstallerSidebar: electron/installer-sidebar.bmp
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  # The wizard's own strings exist in these; Luxembourgish falls back to English.
  installerLanguages:
    - en_US
    - de_DE
    - fr_FR

# Where installed copies look for new versions: the public repo's Releases. Uploading needs
# GH_TOKEN, and only happens with `npm run desktop:release`.
publish:
  provider: github
  owner: Florian-Stronck
  repo: topset
