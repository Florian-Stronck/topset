name: Bug report
description: Something in Topset doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach a real `topset.db` or backup. They hold your athletes' data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app (Topset.exe)
        - Athlete page on a phone
        - Self-hosted server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you downloaded, or the commit you built from.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error text
      description: The contents of topset-error.log beside Topset.exe help if the app didn't start.
