name: Feature request
description: Something coaches or athletes need that Topset doesn't do yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The coaching problem, not only the button you'd add.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
