name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm on Windows leaves some Linux-only optional packages out of package-lock.json,
      # which npm ci then refuses; npm install fills them in for this run.
      - run: npm ci || npm install --no-audit --no-fund
        env:
          # The desktop app's Electron binary isn't needed to lint, type-check or test.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
